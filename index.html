<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Сопромат Визуализатор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 65vh;
            display: block;
        }
        .controls-panel {
            height: 35vh;
            background: #242424;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }
        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
            text-align: center;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .slider-label {
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            color: #ccc;
        }
        input[type=range] {
            width: 100%;
            accent-color: #38bdf8;
        }
        .info-card {
            background: #18181b;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            display: flex;
            justify-content: space-around;
            border: 1px solid #3f3f46;
        }
        .info-item {
            text-align: center;
        }
        .info-val {
            font-weight: bold;
            color: #38bdf8;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="controls-panel">
        <div class="panel-title">📐 3D Изогнутая Балка</div>
        
        <div class="slider-group">
            <div class="slider-label">
                <span>Нагрузка (P):</span>
                <span id="force-val">50 кН</span>
            </div>
            <input type="range" id="force-slider" min="0" max="100" value="50">
        </div>

        <div class="info-card">
            <div class="info-item">
                <div>Макс. Прогиб (f):</div>
                <div class="info-val" id="deflection-val">0.00 мм</div>
            </div>
            <div class="info-item">
                <div>Мпрог (Mmax):</div>
                <div class="info-val" id="moment-val">0.00 кН·м</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
