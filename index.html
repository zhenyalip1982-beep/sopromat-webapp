<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сопромат 3D Визуализатор</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #121212; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .ui-container {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px); border-radius: 16px; padding: 16px; z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
        }
        .control-group { margin-bottom: 12px; }
        .control-group label { display: block; font-size: 13px; margin-bottom: 6px; color: #aaa; }
        select, input[type="range"] { width: 100%; box-sizing: border-box; }
        select { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 8px; font-size: 14px; outline: none; }
        input[type="range"] { accent-color: #3498db; cursor: pointer; }
        .stats { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); }
        .stat-item { text-align: center; flex: 1; }
        .stat-item span { display: block; font-size: 11px; color: #888; }
        .stat-item strong { font-size: 14px; color: #3498db; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="ui-container">
        <div class="control-group">
            <label for="object-select">Тип расчета:</label>
            <select id="object-select">
                <option value="beam">Шарнирная балка (Изгиб)</option>
                <option value="shaft">Круглый вал (Кручение)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Нагрузка (P): <span id="load-value">100</span> кН</label>
            <input type="range" id="load-range" min="10" max="200" value="100">
        </div>
        <div class="stats">
            <div class="stat-item">
                <span>Макс. Прогиб (f):</span>
                <strong id="deflection-val">15.00 мм</strong>
            </div>
            <div class="stat-item">
                <span>Мпрог (Mmax):</span>
                <strong id="moment-val">150.0 кН·м</strong>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
